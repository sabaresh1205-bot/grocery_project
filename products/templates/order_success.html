{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Shop | Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'ecom/css/style.css' %}">
</head>
<style>
.product-img-wrapper {
    height: 220px;           
    overflow: hidden;
}

.product-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;       
}

.product-card {
    border-radius: 10px;
}

  </style>
<body>

<div class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">E-Shop</a>
        <a href="{% url 'home' %}" class="text-decoration-none text-white">Home</a>
    </div>
</div>

<div class="content mt-4">
    <div class="container-fluid">
    <h2>Order Placed Successfully 🎉</h2>

    <p><strong>Order ID:</strong> {{ order.order_number }}</p>
    <p><strong>Total:</strong> ₹{{ order.total_amount }}</p>
    <p><strong>Status:</strong> {{ order.order_status }}</p>
  
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
