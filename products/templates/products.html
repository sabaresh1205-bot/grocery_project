{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'grocery/css/style.css' %}">
  <style>
    .feature-card {
  border: none;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

.feature-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.bg-gradient {
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

body {
  font-family: Arial, sans-serif;
}

.card img {
  height: 250px;
  object-fit: cover;
}

.card {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.product-img-wrapper {
  width: 100%;
  aspect-ratio: 4 / 3;  
  overflow: hidden;
  background-color: #f8f9fa;
}

.product-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;  
}


.product-card {
  border-radius: 10px;
}
  </style>
</head>
<body>

<div class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Grocery Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'home'%}">Home</a>
          </li>
          <li class="nav-item me-3 position-relative">
          <a class="nav-link" href="{% url 'viewCart' %}">
            <i class="bi bi-cart fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{cart_count}}
            </span>
          </a>
        </ul>
      </div>
    </div>
  </nav>

  <div class="content mt-3">
  <div class="container-fluid">
    <div class="row g-4">

      {% for product in products %}
      <div class="col-lg-4 col-md-4 col-sm-6">
        <div class="card product-card h-100">

          <div class="product-img-wrapper">
            <img src="{{ product.product_cover_image }}" alt="{{ product.product_name }}" class="img-fluid">
            <p>{{ product.product_cover_image.url }}</p>
          </div>

          <div class="card-body d-flex flex-column">
            <h6 class="card-title">{{ product.product_name }}</h6>
            <p class="text-muted mb-2">{{ product.product_price}}</p>

            <a href="/add-to-cart/{{product.product_id}}/" class="btn btn-success mt-auto w-100">
              Add to Cart
            </a>
          </div>
        </div>
      </div>
      {% endfor %}

    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
