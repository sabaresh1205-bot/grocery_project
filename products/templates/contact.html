{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Shop</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'grocery/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Grocery shop</a>
            <a class="text-white text-decoration-none" style="padding-right: 200px;" href="{% url 'home' %}">Home</a>
        </div>
    </nav>

    <div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h3 class="mb-4 text-center">Contact Us</h3>

      {% if success %}
        <div class="alert alert-success">{{ success }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone (optional)</label>
          <input type="text" name="phone" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" class="form-control" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">
          Send Message
        </button>
      </form>

      <hr class="my-4">

      <h6>📍 Store Address</h6>
      <p>
        Green Basket Grocery<br>
        Coimbatore – 641001
      </p>

      <p>📞 +91 98765 43210</p>
      <p>📧 support@greenbasket.com</p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
