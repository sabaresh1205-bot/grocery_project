{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List | edit products</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'grocery/css/style.css' %}">
</head>
<body>

<div class="container mt-5">
  <h4 class="mb-4">Edit Product</h4>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label>Product Name</label>
      <input type="text" name="product_name"
             value="{{ product.product_name }}"
             class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Description</label>
      <textarea name="product_description"
                class="form-control"
                required>{{ product.product_description }}</textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Price</label>
        <input type="number" name="product_price"
               value="{{ product.product_price }}"
               class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label>Quantity</label>
        <input type="number" name="product_quantity"
               value="{{ product.product_quantity }}"
               class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label>Current Image</label><br>
      <img src="{{ product.product_cover_image.url }}"
           width="120" class="mb-2">
    </div>

    <div class="mb-3">
      <label>Change Image</label>
      <input type="file" name="product_cover_image"
             class="form-control">
    </div>

    <button class="btn btn-success">Update Product</button>
    <a href="{% url 'productList' %}" class="btn btn-secondary">Cancel</a>

  </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
