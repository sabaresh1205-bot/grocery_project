{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Shop | Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'ecom/css/style.css' %}">
</head>
<body>

<div class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">E-Shop</a>
        <a href="{% url 'home' %}" class="text-decoration-none text-white">Home</a>
    </div>
</div>

<div class="content mt-4">
    <div class="container-fluid">
        <h2>Order Summary</h2>
        <p><strong>Order Number : </strong>{{order.order_number}}</p>
        <p><strong>Customer Name : </strong>{{order.name}}</p>
        <p><strong>Customer Contact : </strong>{{order.phone}}</p>
        <p><strong>Shipping Address : </strong>{{order.address}}</p>
        <p><strong>Total Amount : </strong>{{order.total_amount}}</p><br>
        <form method="POST" action="{% url 'create_payment' order.order_id %}">
            {% csrf_token %}
            <button class="btn btn-success">Proceed To pay</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
