{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Shop | Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'ecom/css/style.css' %}">
</head>
<body>
<div class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">E-Shop</a>
        <a href="{% url 'home' %}" class="text-decoration-none text-white">Home</a>
    </div>
</div>
<div class="content mt-4">
    <div class="container-fluid">
      <p>Pay ₹ {{order.total_amount}}</p>
      <button class="btn btn-success" id="pay-btn">Pay ₹ {{order.total_amount}} Now</button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "order_id": "{{ order.razorpay_order_id }}",
    "name": "Ecom GRD",
    "handler": function (response) {
        fetch("{% url 'payment_success' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify(response)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                window.location.href = "{% url 'success_page'%}";
            } else {
                alert("Payment verification failed");
            }
        });
    }
};

document.getElementById("pay-btn").onclick = function () {
    new Razorpay(options).open();
};
</script>
</body>
</html>
